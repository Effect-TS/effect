syntax = "proto3";

package acme.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";

// Every scalar type.
message Scalars {
  double f_double = 1;
  float f_float = 2;
  int32 f_int32 = 3;
  int64 f_int64 = 4;
  uint32 f_uint32 = 5;
  uint64 f_uint64 = 6;
  sint32 f_sint32 = 7;
  sint64 f_sint64 = 8;
  fixed32 f_fixed32 = 9;
  fixed64 f_fixed64 = 10;
  sfixed32 f_sfixed32 = 11;
  sfixed64 f_sfixed64 = 12;
  bool f_bool = 13;
  string f_string = 14;
  bytes f_bytes = 15;
}

enum Color {
  COLOR_UNSPECIFIED = 0;
  COLOR_RED = 1;
  COLOR_GREEN = 2;
  COLOR_BLUE = 3;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}

// Repeated, maps, optional, oneof, nested types.
message Shapes {
  message Circle {
    Point center = 1;
    double radius = 2;
  }

  repeated int32 numbers = 1;
  repeated string names = 2;
  repeated Point points = 3;
  repeated Color colors = 4;
  map<string, int32> counts = 5;
  map<int32, string> labels = 6;
  map<string, Point> named_points = 7;
  optional string nickname = 8;
  optional int32 maybe_number = 9;
  Point origin = 10;
  Color primary = 11;

  oneof shape {
    Circle circle = 12;
    Point square_corner = 13;
    string label = 14;
    int64 code = 15;
  }
}

// Well-known types.
message WellKnown {
  google.protobuf.Timestamp created_at = 1;
  google.protobuf.Duration ttl = 2;
  google.protobuf.StringValue maybe_text = 3;
  google.protobuf.Int32Value maybe_int = 4;
  google.protobuf.BoolValue maybe_bool = 5;
  google.protobuf.Struct attributes = 6;
  google.protobuf.Value anything = 7;
  google.protobuf.Empty nothing = 8;
}

// A recursive message.
message TreeNode {
  string name = 1;
  repeated TreeNode children = 2;
}

message GetPointRequest {
  int32 id = 1;
}

message ListPointsRequest {
  int32 limit = 1;
}

service PointService {
  // Returns a single point.
  rpc GetPoint(GetPointRequest) returns (Point);
  // Streams points.
  rpc ListPoints(ListPointsRequest) returns (stream Point);
  rpc Ping(google.protobuf.Empty) returns (google.protobuf.Empty);
}
