# Mutations with an input object variable and an inline input object literal.
mutation AddComment($input: AddCommentInput!) {
  addComment(input: $input) {
    commentEdge {
      node {
        id
        body
        createdAt
      }
    }
  }
}

mutation AddReaction($subjectId: ID!, $content: ReactionContent!) {
  addReaction(input: { subjectId: $subjectId, content: $content, clientMutationId: "effect" }) {
    reaction {
      content
    }
  }
}
