# The signed-in user and a page of their repositories.
query ViewerRepos($first: Int = 10, $after: String) {
  viewer {
    login
    name
    repositories(first: $first, after: $after, orderBy: { field: UPDATED_AT, direction: DESC }) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ...RepoSummary
      }
    }
  }
}

fragment RepoSummary on Repository {
  id
  nameWithOwner
  description
  isPrivate
  stargazerCount
  updatedAt
}
