  - '[{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/app_id/anyOf","value":[{"type":"number"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/app_id/type"},{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/moderation_latency/anyOf","value":[{"type":"number"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/moderation_latency/type"},{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/external_user/anyOf","value":[{"type":"string"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/external_user/type"},{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_media_prompt/anyOf","value":[{"type":"number"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_media_prompt/type"},{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_input_audio_prompt/anyOf","value":[{"type":"number"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_input_audio_prompt/type"},{"op":"add","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_search_results/anyOf","value":[{"type":"number"},{"type":"null"}]},{"op":"remove","path":"/paths/~1generation/get/responses/200/content/application~1json/schema/properties/data/properties/num_search_results/type"}]'
