# yaml-language-server: $schema=../../tools/ai-codegen/codegen.schema.json
# The Anthropic SDK stopped publishing `openapi_spec_url` in `.stats.yml` (anthropic-sdk-typescript@8752d02), so the
# spec it bundles at that commit is pinned. To update, pin a newer anthropic-sdk-typescript commit and regenerate from the repo root:
#   nix develop -c node packages/tools/ai-codegen/src/bin.ts generate --provider anthropic
spec: https://raw.githubusercontent.com/anthropics/anthropic-sdk-typescript/8752d0242274ddec2228fdb6d99a0c5a8885e6d7/scripts/mock-spec.json.gz
output: src/Generated.ts
name: AnthropicClient
patches:
  # Allow system messages in conversation history.
  - '[{"op":"replace","path":"/components/schemas/BetaInputMessage/properties/role/enum","value":["user","assistant","system"]},{"op":"replace","path":"/components/schemas/InputMessage/properties/role/enum","value":["user","assistant","system"]}]'
  # Make every BetaUsage field except input and output tokens optional, and every BetaMessageDeltaUsage field except output tokens (API and Anthropic-compatible gateways may omit these fields, #8464, #9963)
  - '[{"op":"replace","path":"/components/schemas/BetaUsage/required","value":["input_tokens","output_tokens"]},{"op":"replace","path":"/components/schemas/BetaMessageDeltaUsage/required","value":["output_tokens"]}]'
  # Make model optional in BetaMessageIterationUsage (gateways and older responses may omit it)
  - '[{"op":"replace","path":"/components/schemas/BetaMessageIterationUsage/required","value":["cache_creation","cache_creation_input_tokens","cache_read_input_tokens","input_tokens","output_tokens","type"]}]'
  # Make inference_geo, server_tool_use and output_tokens_details optional in Usage and MessageDeltaUsage (API and Anthropic-compatible gateways may omit them, #8464)
  - '[{"op":"replace","path":"/components/schemas/Usage/required","value":["cache_creation","cache_creation_input_tokens","cache_read_input_tokens","input_tokens","output_tokens","service_tier"]},{"op":"replace","path":"/components/schemas/MessageDeltaUsage/required","value":["cache_creation_input_tokens","cache_read_input_tokens","input_tokens","output_tokens"]}]'
  # Make stop_details optional in messages and message deltas, and diagnostics, context_management and container optional in BetaMessage and BetaMessageDelta (older responses and Anthropic-compatible gateways may omit them)
  - '[{"op":"replace","path":"/components/schemas/Message/required","value":["id","type","role","content","model","stop_reason","stop_sequence","usage","container"]},{"op":"replace","path":"/components/schemas/BetaMessage/required","value":["id","type","role","content","model","stop_reason","stop_sequence","usage"]},{"op":"replace","path":"/components/schemas/MessageDelta/required","value":["container","stop_reason","stop_sequence"]},{"op":"replace","path":"/components/schemas/BetaMessageDelta/required","value":["stop_reason","stop_sequence"]}]'
  # Make capability and limit fields optional in model info (older responses and Anthropic-compatible gateways may omit them)
  - '[{"op":"replace","path":"/components/schemas/ModelInfo/required","value":["created_at","display_name","id","type"]},{"op":"replace","path":"/components/schemas/BetaModelInfo/required","value":["created_at","display_name","id","type"]}]'
  # Make fields newer than the previous spec optional in compaction, thinking and container responses (older responses may omit them)
  - '[{"op":"replace","path":"/components/schemas/BetaCompactionContentBlockDelta/required","value":["content","type"]},{"op":"replace","path":"/components/schemas/BetaResponseCompactionBlock/required","value":["content","type"]},{"op":"replace","path":"/components/schemas/BetaThinkingContentBlockDelta/required","value":["thinking","type"]},{"op":"replace","path":"/components/schemas/Container/required","value":["expires_at","id"]}]'
  # Make citations optional in response text blocks, and context_management optional in BetaMessageDeltaEvent (API may omit these fields)
  - '[{"op":"replace","path":"/components/schemas/ResponseTextBlock/required","value":["text","type"]},{"op":"replace","path":"/components/schemas/BetaResponseTextBlock/required","value":["text","type"]},{"op":"replace","path":"/components/schemas/BetaMessageDeltaEvent/required","value":["delta","type","usage"]}]'
# Only generate the endpoints the client supports
includePaths:
  - /v1/messages
  - /v1/complete
  - /v1/models
  - /v1/models/{model_id}
  - /v1/messages/batches
  - /v1/messages/batches/{message_batch_id}
  - /v1/messages/batches/{message_batch_id}/cancel
  - /v1/messages/batches/{message_batch_id}/results
  - /v1/messages/count_tokens
  - /v1/files
  - /v1/files/{file_id}
  - /v1/files/{file_id}/content
  - /v1/skills
  - /v1/skills/{skill_id}
  - /v1/skills/{skill_id}/versions
  - /v1/skills/{skill_id}/versions/{version}
  - /v1/messages?beta=true
  - /v1/models?beta=true
  - /v1/models/{model_id}?beta=true
  - /v1/messages/batches?beta=true
  - /v1/messages/batches/{message_batch_id}?beta=true
  - /v1/messages/batches/{message_batch_id}/cancel?beta=true
  - /v1/messages/batches/{message_batch_id}/results?beta=true
  - /v1/messages/count_tokens?beta=true
  - /v1/files?beta=true
  - /v1/files/{file_id}?beta=true
  - /v1/files/{file_id}/content?beta=true
  - /v1/skills?beta=true
  - /v1/skills/{skill_id}?beta=true
  - /v1/skills/{skill_id}/versions?beta=true
  - /v1/skills/{skill_id}/versions/{version}?beta=true
# Generate schemas no included operation references: the stream events the client decodes, the memory tool
# commands, and the batch results (served as JSON Lines, which the generated client does not decode)
includeSchemas:
  - MessageStreamEvent
  - BetaMessageStreamEvent
  - BetaMemoryTool_20250818_Command
  - MessageBatchIndividualResponse
  - BetaMessageBatchIndividualResponse
# Keep the single `4XX` error response per operation; 5xx responses are handled as status code errors
errorStatusRanges:
  - 4XX
header: |
  /**
   * @stability unstable
   * @since 4.0.0
   */
  // The spec's string patterns intentionally exclude control characters.
  /* oxlint-disable no-control-regex */
excludeAnnotations:
  - examples
disableAdditionalProperties: true
replacements:
  # Schema.Unknown doesn't work with Schema.toCodecJson (used by HttpClientResponse.schemaBodyJson)
  # Replace index signatures with Schema.Json, which properly handles arbitrary JSON values
  - from: "{ readonly [x: string]: unknown }"
    to: "{ readonly [x: string]: Schema.Json }"
  # Index signature in struct rest pattern
  - from: "readonly [x: string]: unknown"
    to: "readonly [x: string]: Schema.Json"
