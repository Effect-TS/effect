name: Release
on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Prevent newer push from interrupting active release

permissions: {}

# On every push to main, `pnpm release route` decides between:
#   Version: pending change intents -> create or update the "Version Packages"
#            pull request from `pnpm version -r` (bumps, changelogs, ledger).
#   Stage:   the version PR merged -> build and `pnpm stage publish` every
#            unpublished version. Nothing is published directly; a maintainer
#            approves the staged versions afterwards (approval flow and the
#            website deployment that follows it are pending a decision, see
#            EFF-1455).
#   Idle:    nothing to do.
jobs:
  release:
    if: github.repository_owner == 'Effect-Ts'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # A personal access token, not the workflow token, so that checks run
          # on the version branch this job pushes.
          token: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Decide route
        id: route
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          set -euo pipefail
          route="$(pnpm --silent release route)"
          echo "$route"
          echo "tag=$(echo "$route" | jq -r '._tag')" >> "$GITHUB_OUTPUT"
      - name: Create or update the version pull request
        if: steps.route.outputs.tag == 'Version'
        env:
          GH_TOKEN: ${{ secrets.CHANGESET_GITHUB_TOKEN }}
        run: pnpm --silent release run --tag rc
      - name: Set strip internals config
        if: steps.route.outputs.tag == 'Stage'
        run: node scripts/set-strip-internal.mjs
      - name: Run codemods
        if: steps.route.outputs.tag == 'Stage'
        run: pnpm codemod
      - name: Build packages
        if: steps.route.outputs.tag == 'Stage'
        env:
          # Leave memory for the runner and package builds on the 8 GB runner.
          # The native TypeScript compiler uses Go's soft memory limit.
          GOMEMLIMIT: 4GiB
        run: pnpm build
      - name: Stage packages on npm
        if: steps.route.outputs.tag == 'Stage'
        env:
          NPM_STAGE_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: pnpm --silent release run --tag rc
