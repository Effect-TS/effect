name: Check
# EFF-2213 diagnostic branch only: instrumented Bun PostgreSQL lifecycle reproduction.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pg-lifecycle:
    name: PG lifecycle (${{ matrix.runtime }} ${{ matrix.mode }} ${{ matrix.shard }})
    runs-on: namespace-profile-linux-default
    env:
      EFFECT_INTEGRATION_TESTS: "1"
      TESTCONTAINERS_RYUK_DISABLED: "true"
      PG_LIFECYCLE_DIAGNOSTICS: "1"
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full-suite runs reproduce the original concurrency pressure.
          - { runtime: Bun, bun: 1.4.0, mode: full, shard: 1, iterations: 1 }
          - { runtime: Bun, bun: 1.4.0, mode: full, shard: 2, iterations: 1 }
          - { runtime: Bun, bun: 1.4.0, mode: full, shard: 3, iterations: 1 }
          # Isolated loops of the failing file.
          - { runtime: Bun, bun: 1.4.0, mode: file, shard: 1, iterations: 25 }
          - { runtime: Bun, bun: 1.4.0, mode: file, shard: 2, iterations: 25 }
          - { runtime: Bun, bun: 1.4.0, mode: file, shard: 3, iterations: 25 }
          # Node control for the isolated loop.
          - { runtime: Node, bun: "", mode: file, shard: 1, iterations: 25 }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-pull test container images
        run: |
          docker pull ghcr.io/tursodatabase/libsql-server:main &
          docker pull postgres:alpine &
          docker pull mysql:lts &
          docker pull mcr.microsoft.com/mssql/server:2022-latest &
          docker pull vitess/vttestserver:mysql80 &
          docker pull redis:alpine &
          docker pull coredns/coredns:1.14.7 &
          wait

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          bun-version: ${{ matrix.bun }}

      - name: Run with PostgreSQL lifecycle capture
        shell: bash
        env:
          CAPTURE_DIR: ${{ runner.temp }}/pg-lifecycle
          MODE: ${{ matrix.mode }}
          RUNTIME: ${{ matrix.runtime }}
          ITERATIONS: ${{ matrix.iterations }}
        run: |
          mkdir -p "$CAPTURE_DIR"
          started_at=$(date --iso-8601=seconds)
          docker version > "$CAPTURE_DIR/docker-version.txt" 2>&1 || true
          bun --version > "$CAPTURE_DIR/bun-version.txt" 2>&1 || true
          docker events --since "$started_at" --format '{{json .}}' > "$CAPTURE_DIR/docker-events.jsonl" 2> "$CAPTURE_DIR/docker-events.stderr" &
          events_pid=$!
          cleanup() {
            kill "$events_pid" 2>/dev/null || true
            wait "$events_pid" 2>/dev/null || true
            # shellcheck disable=SC2024
            sudo -n journalctl -u docker.service --since "$started_at" --no-pager -o short-iso-precise > "$CAPTURE_DIR/docker-journal.log" 2>&1 || true
          }
          trap cleanup EXIT
          failures=0
          for i in $(seq 1 "$ITERATIONS"); do
            export PG_LIFECYCLE_LOG="$CAPTURE_DIR/lifecycle-$i.log"
            if [ "$MODE" = full ]; then
              cmd=(bun run --bun vitest run --max-concurrency=10)
            elif [ "$RUNTIME" = Bun ]; then
              cmd=(bun run --bun vitest run --max-concurrency=10 packages/sql/pg/test/Client.integration.test.ts)
            else
              cmd=(pnpm vitest run --max-concurrency=10 packages/sql/pg/test/Client.integration.test.ts)
            fi
            echo "::group::iteration $i: ${cmd[*]}"
            set +e
            "${cmd[@]}" > "$CAPTURE_DIR/tests-$i.log" 2>&1
            status=$?
            set -e
            echo "::endgroup::"
            echo "iteration $i exit=$status" | tee -a "$CAPTURE_DIR/summary.txt"
            if [ "$status" -ne 0 ]; then
              failures=$((failures + 1))
              grep -E "FAIL|Hook timed out|Error" "$CAPTURE_DIR/tests-$i.log" | head -20 || true
              grep -h "pg-lifecycle" "$PG_LIFECYCLE_LOG" | grep -vE " done | mark " | tail -40 || true
            fi
          done
          echo "failures=$failures/$ITERATIONS" | tee -a "$CAPTURE_DIR/summary.txt"
          test "$failures" -eq 0

      - name: Upload PostgreSQL lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pg-lifecycle-${{ matrix.runtime }}-${{ matrix.mode }}-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pg-lifecycle
          retention-days: 30
          if-no-files-found: warn
