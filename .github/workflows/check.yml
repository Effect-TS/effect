name: Check
on:
  workflow_dispatch:
  pull_request:
    branches: [main, v4/next-minor, v4/next-major]
  push:
    branches: [main, v4/next-minor, v4/next-major]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static-checks:
    name: Static
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint
      - name: Check JSDoc
        run: pnpm jsdocs --check
      - name: Check circular dependencies
        run: pnpm circular
      - name: Generate AI documentation
        run: pnpm ai-docgen
      - name: Verify AI documentation is up-to-date
        run: |
          if [ -n "$(git status --short)" ]; then
            git status --short
            echo "Run 'pnpm ai-docgen' and commit generated changes."
            exit 1
          fi

  types:
    name: Types
    runs-on: namespace-profile-linux-small
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          deno-version: v2.9.7
      - run: pnpm check
        env:
          # Leave memory headroom for the runner by collecting the Go heap earlier.
          GOMEMLIMIT: 4GiB
      - run: deno check .
      - run: pnpm test-types --target '>=5.9'

  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Set strip internals config
        run: |
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
      - run: pnpm build
      - run: pnpm check-dist-types

  bundle:
    name: Bundle
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Clone base ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: base
          ref: ${{ github.event.pull_request.base.ref }}
      - name: Set strip internals config
        run: |
          sed -i 's/"stripInternal": false/"stripInternal": true/' tsconfig.base.json
          sed -i 's/"stripInternal": false/"stripInternal": true/' base/tsconfig.base.json
      - name: Build
        run: |
          pnpm build
          cd base
          pnpm install
          pnpm build
      - name: Compare bundle size
        run: node ./packages/tools/bundle/src/bin.ts compare --base-dir base/packages/tools/bundle/fixtures
      - name: Upload stats artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-stats
          path: stats.txt
          if-no-files-found: error

  test:
    name: Test (${{ matrix.runtime }})
    runs-on: namespace-profile-linux-default
    env:
      EFFECT_INTEGRATION_TESTS: "1"
      # The ephemeral runner provides cleanup without a Ryuk sidecar.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node
            deno: ""
            bun: ""
            command: pnpm test --max-concurrency=10
          - runtime: Deno
            deno: v2.9.7
            bun: ""
            command: deno task test --max-concurrency=10
          - runtime: Bun
            deno: ""
            bun: 1.4.0
            command: bun run --bun vitest run --max-concurrency=10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pre-pull test container images
        run: |
          docker pull ghcr.io/tursodatabase/libsql-server:main &
          docker pull postgres:alpine &
          docker pull mysql:lts &
          docker pull mcr.microsoft.com/mssql/server:2022-latest &
          docker pull vitess/vttestserver:mysql80 &
          docker pull redis:alpine &
          docker pull coredns/coredns:1.14.7 &
          wait

      - name: Install dependencies
        uses: ./.github/actions/setup
        with:
          deno-version: ${{ matrix.deno }}
          bun-version: ${{ matrix.bun }}
      # Cores contain process memory, including possible credentials. Never upload
      # plaintext. Configure this public RSA certificate before enabling capture;
      # keep its private key outside GitHub Actions and decrypt artifacts offline.
      - name: Prepare encrypted Deno core capture
        id: deno-cores
        if: matrix.runtime == 'Deno'
        env:
          DENO_CORE_CERTIFICATE: ${{ vars.DENO_CORE_CERTIFICATE }}
        run: |
          if [ -z "$DENO_CORE_CERTIFICATE" ]; then
            echo "::warning::Deno core capture disabled: configure DENO_CORE_CERTIFICATE (public RSA X.509 certificate)."
            exit 0
          fi
          umask 077
          capture="$RUNNER_TEMP/deno-cores"
          mkdir -p "$capture"
          printf '%s\n' "$DENO_CORE_CERTIFICATE" > "$capture/recipient.pem"
          # Fail before enabling dumps if the certificate cannot encrypt a bundle.
          printf 'capture preflight\n' | openssl cms -encrypt -binary -aes-256-cbc \
            -outform DER -out "$capture/preflight.cms" "$capture/recipient.pem"
          rm "$capture/preflight.cms"
          cp "$(command -v deno)" "$capture/deno"
          deno --version > "$capture/version.txt"
          (cd "$capture" && sha256sum deno > sha256.txt)
          sudo sysctl -w "kernel.core_pattern=$capture/core.%e.%p.%t"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Test
        id: test
        run: |
          if [ "${{ steps.deno-cores.outputs.enabled }}" = "true" ]; then
            ulimit -c unlimited
          fi
          ${{ matrix.command }}
      - name: Encrypt Deno crash bundle
        id: deno-crash
        if: failure() && matrix.runtime == 'Deno' && steps.test.outcome == 'failure' && steps.deno-cores.outputs.enabled == 'true'
        run: |
          umask 077
          capture="$RUNNER_TEMP/deno-cores"
          trap 'rm -rf "$capture"' EXIT
          shopt -s nullglob
          cores=("$capture"/core.deno.*)
          if [ "${#cores[@]}" -eq 0 ]; then
            exit 0
          fi
          # Only encrypted bytes reach upload-artifact. No raw cores or tar files.
          tar -czf - -C "$capture" deno version.txt sha256.txt "${cores[@]##*/}" | \
            openssl cms -encrypt -binary -stream -aes-256-cbc -outform DER \
              -out "$RUNNER_TEMP/deno-crash.tar.gz.cms" "$capture/recipient.pem"
          echo "captured=true" >> "$GITHUB_OUTPUT"
      - name: Upload encrypted Deno crash bundle
        if: failure() && matrix.runtime == 'Deno' && steps.deno-crash.outputs.captured == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deno-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deno-crash.tar.gz.cms
          if-no-files-found: error
          retention-days: 1
      - name: Remove local Deno crash data
        if: always() && matrix.runtime == 'Deno'
        run: rm -rf "$RUNNER_TEMP/deno-cores" "$RUNNER_TEMP/deno-crash.tar.gz.cms"

  doctest:
    name: Test (Documentation)
    runs-on: namespace-profile-linux-small
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Test Documentation
        run: pnpm doctest
