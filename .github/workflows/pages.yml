name: Pages

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        uses: ./.github/actions/setup
      - name: Generate documentation
        run: pnpm docgen
      - name: Configure site
        run: cp .github/pages/{_config.yml,index.md} docs/
      - name: Build pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-v4
          path: ./_site
          include-hidden-files: true

  publish:
    if: github.repository_owner == 'Effect-Ts' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: pages-v4
          path: site
      - name: Check out publication branch
        run: |
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
            git worktree add --detach publication refs/remotes/origin/gh-pages
            git -C publication switch -c gh-pages
          else
            git worktree add --detach publication
            git -C publication switch --orphan gh-pages
          fi
      - name: Publish v4 documentation
        run: |
          git -C publication config user.name github-actions[bot]
          git -C publication config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            if git fetch origin gh-pages:refs/remotes/origin/gh-pages; then
              git -C publication reset --hard refs/remotes/origin/gh-pages
            fi
            rsync -a --delete --exclude=.git --exclude=v3 site/ publication/
            git -C publication add --all
            if git -C publication diff --cached --quiet; then
              exit 0
            fi
            git -C publication commit -m "Publish v4 API documentation"
            if git -C publication push origin HEAD:gh-pages; then
              exit 0
            fi
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 2))
          done

  deploy:
    if: github.repository_owner == 'Effect-Ts' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: publication
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publication
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
