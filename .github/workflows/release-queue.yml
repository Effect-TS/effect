name: Release queue
on:
  issue_comment:
    types: [created]
  pull_request_target:
    branches: [main, v4/next-minor, v4/next-major]
  push:
    branches: [main, v4/next-minor, v4/next-major]

permissions: {}

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.EFFECT_BOT_GH }}
      # This checks out untrusted fork code with privileged bot credentials available to subsequent steps.
      # No step may execute code from the working tree (including installs, builds, or repo scripts).
      # The pinned release action only reads changeset files on the fork PR path.
      - run: gh pr checkout ${{ github.event.pull_request.number }}
        if: github.event.pull_request
        env:
          GITHUB_TOKEN: ${{ secrets.EFFECT_BOT_GH }}
      - uses: Effect-TS/next-release-action@63daaa626282bc42fad44dcb89c7f7db9c53b786
        with:
          github_token: ${{ secrets.EFFECT_BOT_GH }}
          base_branch: main
          eligible_branches: v4/next-minor,v4/next-major
          git_user: effect-bot
          git_email: tech-ops@effectful.co
