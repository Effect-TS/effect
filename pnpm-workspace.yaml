packages:
  - ai-docs
  - scratchpad
  - scripts
  - packages/*
  - packages/ai/*
  - packages/atom/*
  - packages/platform/*
  - packages/sql/*
  - packages/tools/*
  - examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  core-js: false
  cpu-features: false
  dprint: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  workerd: false

patchedDependencies:
  '@changesets/cli@3.0.3': patches/@changesets__cli@3.0.3.patch
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch

minimumReleaseAgeExclude:
  - '@effect/tsgo-darwin-arm64@0.51.0'
  - '@effect/tsgo-darwin-x64@0.51.0'
  - '@effect/tsgo-linux-arm64@0.51.0'
  - '@effect/tsgo-linux-arm@0.51.0'
  - '@effect/tsgo-linux-x64@0.51.0'
  - '@effect/tsgo-win32-arm64@0.51.0'
  - '@effect/tsgo-win32-x64@0.51.0'
  - '@effect/tsgo@0.51.0'
  - '@alchemy.run/*'
  - alchemy
  - '@effect/platform-bun@4.0.0-rc.116 || 4.0.0'
  - '@effect/platform-node-shared@4.0.0-rc.116 || 4.0.0'
  - '@effect/platform-node@4.0.0-rc.116 || 4.0.0'
  - '@effect/sql-mysql2@4.0.0-rc.116 || 4.0.0'
  - '@effect/sql-pg@4.0.0-rc.116 || 4.0.0'

overrides:
  # jsdom 30.1.0 fails under Bun when Vitest installs its window error handler.
  # Remove after a later jsdom release passes the Atom React and Solid suites under Bun.
  # Upstream changes: https://github.com/jsdom/jsdom/compare/v30.0.1...v30.1.0
  jsdom: ~30.0.1
  # fake-indexeddb 6.2.6 stores in-line keyPath keys without normalizing them, so
  # binary (Uint8Array) keys throw DataError during comparison in EventJournal.makeIndexedDb.
  # Remove after a later fake-indexeddb release passes the EventJournal IndexedDB suite.
  fake-indexeddb: 6.2.5
  # alchemy's dependency tree pulls @types/ssh2, whose @types/node@18 would
  # otherwise join the shared tests compilation and clash with the workspace
  # @types/node globals.
  '@types/ssh2>@types/node': ^26.6.3
