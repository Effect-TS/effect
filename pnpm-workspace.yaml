packages:
  - ai-docs
  - scratchpad
  - scripts
  - packages/*
  - packages/ai/*
  - packages/atom/*
  - packages/platform/*
  - packages/sql/*
  - packages/tools/*
  - examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  core-js: false
  cpu-features: false
  dprint: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  workerd: false

patchedDependencies:
  '@changesets/get-github-info@1.0.0': patches/@changesets__get-github-info@1.0.0.patch

minimumReleaseAgeExclude:
  - '@alchemy.run/cloudflare-runtime@2.0.0-beta.76'
  - '@alchemy.run/floci@2.0.0-beta.76'
  - '@alchemy.run/node-utils@2.0.0-beta.76'
  - alchemy@2.0.0-beta.76

# alchemy's dependency tree pulls @types/ssh2, whose @types/node@18 would
# otherwise join the shared tests compilation and clash with the workspace
# @types/node globals.
overrides:
  '@types/ssh2>@types/node': ^26.2.0
