packages:
  - ai-docs
  - scratchpad
  - scripts
  - packages/*
  - packages/ai/*
  - packages/atom/*
  - packages/platform/*
  - packages/sql/*
  - packages/tools/*
  - examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

allowBuilds:
  core-js: false
  cpu-features: false
  dprint: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  workerd: false

patchedDependencies:
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch

overrides:
  # jsdom 30.1.0 fails under Bun when Vitest installs its window error handler.
  jsdom: ~30.0.1

minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260920.1'
  - '@op-engineering/op-sqlite@18.2.5'
  - react-error-boundary@6.1.6
  - tsx@4.23.15
