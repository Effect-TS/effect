packages:
  - ai-docs
  - scratchpad
  - scripts
  - packages/*
  - packages/ai/*
  - packages/atom/*
  - packages/platform/*
  - packages/sql/*
  - packages/tools/*
  - examples/*

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false
# pnpm 11 aborts a tarball download that has not finished within fetchTimeout (default 60s),
# however fast it is still progressing. @op-engineering/op-sqlite is a 115 MB tarball and times
# out when registry throughput drops below ~1.9 MB/s; 180s covers sustained rates down to ~0.64 MB/s.
fetchTimeout: 180000

allowBuilds:
  electron: false
  core-js: false
  cpu-features: false
  dprint: false
  esbuild: false
  protobufjs: false
  sharp: false
  ssh2: false
  tree-sitter: false
  tree-sitter-javascript: false
  tree-sitter-typescript: false
  workerd: false

patchedDependencies:
  'drizzle-orm@1.0.0-rc.4': packages/drizzle-effect-v4-patch/patches/drizzle-orm@1.0.0-rc.4.patch
  '@changesets/get-github-info@1.0.1': patches/@changesets__get-github-info@1.0.1.patch

overrides:
  # jsdom 30.1.0 fails under Bun when Vitest installs its window error handler.
  # Remove after a later jsdom release passes the Atom React and Solid suites under Bun.
  # Upstream changes: https://github.com/jsdom/jsdom/compare/v30.0.1...v30.1.0
  jsdom: ~30.0.1
  # fake-indexeddb 6.2.6 stores in-line keyPath keys without normalizing them, so
  # binary (Uint8Array) keys throw DataError during comparison in EventJournal.makeIndexedDb.
  # Remove after a later fake-indexeddb release passes the EventJournal IndexedDB suite.
  fake-indexeddb: 6.2.5
