effect/MetricState:
  replacement: varies by API
  note: All state brand symbols were removed; v4 state interfaces are structural. Standalone state guards were removed. Retain the enclosing snapshot and switch on snapshot.type for runtime discrimination. States are structural objects and no longer carry a variance brand.
