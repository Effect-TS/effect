"@effect/ai-amazon-bedrock/AmazonBedrockSchema":
  replacement: "AmazonBedrockSchema"
  note: "The module now exposes plain schemas for the provider-supported Converse subset. Replace schema-class construction with plain objects or schema decoding. Most schemas no longer export a same-named type; use typeof SchemaName.Type (or .Encoded for requests). Response structs preserve unknown fields, but removed guardrail and trace schemas no longer validate those fields."

"@effect/ai-amazon-bedrock/AmazonBedrockSchema#BedrockFoundationModelId":
  replacement: "AmazonBedrockLanguageModel.Model"
  note: "Model identifiers are now arbitrary strings, allowing inference profile IDs and ARNs. Use Schema.String if you need a runtime schema; there is no fixed model-id literal schema."

