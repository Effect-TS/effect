"@effect/platform/HttpApiMiddleware#HttpApiMiddleware":
  replacement: "effect/httpapi/HttpApiMiddleware#HttpApiMiddleware"
  note: "The model remains but now wraps the response effect and carries provided services, an error schema, and required services."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.Any":
  replacement: "effect/httpapi/HttpApiMiddleware#AnyService"
  note: "Renamed widened middleware service-key shape."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.AnyId":
  replacement: "effect/httpapi/HttpApiMiddleware#AnyId"
  note: "Same name; metadata now includes provided and required services, error schema, client error, and client requirement."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.Error":
  replacement: "effect/httpapi/HttpApiMiddleware#Error"
  note: "Same name and now derives the decoded type from the configured error schema."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.ErrorContext":
  replacement: "effect/httpapi/HttpApiMiddleware#ErrorServicesEncode / ErrorServicesDecode"
  note: "The single schema context split into server encoding and client decoding services."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.Only":
  replacement: "Extract<R, HttpApiMiddleware.AnyId>"
  note: "The helper was removed because middleware IDs are explicit; use Extract when the direct filter is still needed."
"@effect/platform/HttpApiMiddleware#HttpApiMiddleware.Provides":
  replacement: "effect/httpapi/HttpApiMiddleware#Provides"
  note: "Same name and reads the expanded v4 middleware ID metadata."
"@effect/platform/HttpApiMiddleware#SecurityTypeId":
  replacement: "none"
  note: "The marker is private; use HttpApiMiddleware.isSecurity."
"@effect/platform/HttpApiMiddleware#Tag":
  replacement: "effect/httpapi/HttpApiMiddleware#Service"
  note: "Renamed and redesigned; use error, requires, provides, clientError, and requiredForClient configuration."
"@effect/platform/HttpApiMiddleware#TagClass":
  replacement: "effect/httpapi/HttpApiMiddleware#ServiceClass"
  note: "Renamed class type with the new two-stage type configuration and wrapping service shape."
"@effect/platform/HttpApiMiddleware#TagClass.BaseSecurity":
  replacement: "effect/httpapi/HttpApiMiddleware#ServiceClass"
  note: "Security is conditional metadata on ServiceClass; there is no separate public base interface."
"@effect/platform/HttpApiMiddleware#TagClass.Failure":
  replacement: "effect/httpapi/HttpApiMiddleware#Error"
  note: "failure terminology became error; apply the extractor to the middleware ID."
"@effect/platform/HttpApiMiddleware#TagClass.FailureContext":
  replacement: "effect/httpapi/HttpApiMiddleware#ErrorServicesEncode / ErrorServicesDecode"
  note: "Failure schema services split by server encoding and client decoding direction."
"@effect/platform/HttpApiMiddleware#TagClass.FailureSchema":
  replacement: "effect/httpapi/HttpApiMiddleware#ErrorSchema"
  note: "Renamed and applied to the middleware ID rather than constructor options."
"@effect/platform/HttpApiMiddleware#TagClass.FailureService":
  replacement: "effect/httpapi/HttpApiMiddleware#Error"
  note: "Use the decoded error extractor; optional middleware fallback was removed."
"@effect/platform/HttpApiMiddleware#TagClass.Optional":
  replacement: "none"
  note: "Optional declaration and fallback-on-failure behavior were removed; model fallback in the wrapping middleware."
"@effect/platform/HttpApiMiddleware#TagClass.Provides":
  replacement: "effect/httpapi/HttpApiMiddleware#Provides"
  note: "Moved to the module level and applied to the middleware ID."
"@effect/platform/HttpApiMiddleware#TagClassAny":
  replacement: "effect/httpapi/HttpApiMiddleware#AnyService"
  note: "Renamed widened service-key type."
"@effect/platform/HttpApiMiddleware#TagClassSecurityAny":
  replacement: "effect/httpapi/HttpApiMiddleware#AnyServiceSecurity"
  note: "Renamed widened security service-key type."
"@effect/platform/HttpApiMiddleware#TypeId":
  replacement: "none"
  note: "The marker is private; use public guards and type extractors."
