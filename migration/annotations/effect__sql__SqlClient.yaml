"@effect/sql/SqlClient#make":
  replacement: "effect/sql/SqlClient#make"
  note: "Moved; custom clients must supply MakeOptions.driver, rename reactiveMailbox to reactiveQueue, and may supply transactionService. Driver names conventionally omit the @effect/sql- prefix, for example pg or pglite."
"@effect/sql/SqlClient#SafeIntegers":
  replacement: "effect/sql/SqlClient#SafeIntegers"
  note: "Moved and changed from a Reference subclass to a Context.Reference value; provide it as a service."
"@effect/sql/SqlClient#SqlClient":
  replacement: "effect/sql/SqlClient#SqlClient"
  note: "Moved into core Effect. Custom service implementations must expose driver, a string identifying the driver independently of its SQL dialect; SqlClient.make sets it from MakeOptions.driver."
"@effect/sql/SqlClient#SqlClient.MakeOptions":
  replacement: "effect/sql/SqlClient#SqlClient.MakeOptions"
  note: "Moved; driver is now required and conventionally names the driver package without @effect/sql-, for example pg or pglite. Rename reactiveMailbox to reactiveQueue; transactionService is optional."
"@effect/sql/SqlClient#TransactionConnection":
  replacement: "effect/sql/SqlClient#TransactionConnection"
  note: "Now a factory keyed by client id, not a singleton tag. Prefer the client's transactionService; the payload type is TransactionConnection.Service."
"@effect/sql/SqlClient#TypeId":
  replacement: "none"
  note: "The brand is private in v4; do not inspect or attach it, and obtain clients through SqlClient or SqlClient.make."
