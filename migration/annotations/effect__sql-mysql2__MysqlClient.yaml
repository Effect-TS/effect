"@effect/sql-mysql2/MysqlClient#MysqlClient":
  replacement: "@effect/sql-mysql2/MysqlClient#MysqlClient"
  note: "Retained; the service value is now a Context.Service. The MysqlClient interface no longer extends SqlClient.SqlClient. Yielding the service still gives MysqlClient & SqlClient, but an effect that requires MysqlClient no longer type-checks against a SqlClient requirement annotation, and a SqlClient-only layer no longer satisfies MysqlClient. Annotate a layer chosen between drivers as Layer.Layer<SqlClient.SqlClient, E>."
"@effect/sql-mysql2/MysqlClient#MysqlClientConfig":
  replacement: "@effect/sql-mysql2/MysqlClient#MysqlClientConfig"
  note: "Retained; connectionTTL uses Duration.Input and v4 adds disablePreparedStatements."
