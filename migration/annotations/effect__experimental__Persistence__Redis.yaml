"@effect/experimental/Persistence/Redis#layer":
  replacement: effect/unstable/persistence/Persistence#layerBackingRedis
  note: The Redis backing adapter was merged into Persistence and now requires the generic Redis.Redis service.
"@effect/experimental/Persistence/Redis#layerResult":
  replacement: effect/unstable/persistence/Persistence#layerRedis
  note: The combined Redis persistence layer was merged into Persistence and now requires Redis.Redis.
"@effect/experimental/Persistence/Redis":
  replacement: varies by API
  note: Compose Persistence.layerBackingRedis with a config-driven provider such as NodeRedis.layerConfig. Compose Persistence.layerRedis with a config-driven provider such as NodeRedis.layerConfig. V4 exposes Redis-backed layers over the Redis.Redis service, not a constructor that creates an ioredis client directly.
