"@effect/cli/HelpDoc#HelpDoc":
  replacement: "HelpDoc.HelpDoc"
  note: "The name remains, but v4 is a structured command-help record rather than a tagged document AST."
"@effect/cli/HelpDoc#toAnsiText":
  replacement: "CliOutput.defaultFormatter().formatHelpDoc"
  note: "Format the structured help record; inside Effect code prefer the CliOutput.Formatter service."
"@effect/cli/HelpDoc":
  replacement: effect/unstable/cli/HelpDoc
  note: The v3 document-node ADT was removed; v4 uses a structured HelpDoc record rendered by CliOutput. The Span ADT and document-to-span conversion were removed; v4 help fields are strings. CliOutput owns rendering and exposes formatted text rather than an AnsiDoc.
