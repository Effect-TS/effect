  replacement: "HttpRouter.make"
  note: "The layer-oriented router became the sole v4 HttpRouter implementation."
"@effect/platform/HttpLayerRouter#MiddlewareTypeId":
  replacement: "none"
  note: "The middleware type id is internal in v4; use HttpRouter.Middleware."
