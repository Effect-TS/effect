  replacement: "HttpRouter.schemaJson"
  note: "Moved to the consolidated router with v4 Schema and error types."
"@effect/platform/HttpLayerRouter#schemaNoBody":
  replacement: "HttpRouter.schemaNoBody"
  note: "Moved to the consolidated router with v4 Schema types."
"@effect/platform/HttpLayerRouter#serve":
  replacement: "HttpRouter.serve"
