"@effect/platform/HttpLayerRouter#toWebHandler":
  replacement: "HttpRouter.toWebHandler"
  note: "Moved to the consolidated router for building a Fetch handler and disposer."
"@effect/platform/HttpLayerRouter#TypeId":
  replacement: "none"
  note: "The router nominal service id is internal in v4; use HttpRouter.HttpRouter."
