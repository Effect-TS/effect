"@effect/platform/HttpLayerRouter#FindMyWay.make":
  replacement: "FindMyWay.make"
  note: "Import FindMyWay from effect/unstable/http."
"@effect/platform/HttpLayerRouter#FindMyWay.PathInput":
  replacement: "FindMyWay.PathInput"
  note: "Import FindMyWay from effect/unstable/http."
