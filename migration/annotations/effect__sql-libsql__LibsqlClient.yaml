"@effect/sql-libsql/LibsqlClient#LibsqlClient":
  replacement: "@effect/sql-libsql/LibsqlClient#LibsqlClient"
  note: "Retained; the service value is now a Context.Service. The LibsqlClient interface no longer extends SqlClient.SqlClient. Yielding the service still gives LibsqlClient & SqlClient, but an effect that requires LibsqlClient no longer type-checks against a SqlClient requirement annotation, and a SqlClient-only layer no longer satisfies LibsqlClient. Annotate a layer chosen between drivers as Layer.Layer<SqlClient.SqlClient, E>."
