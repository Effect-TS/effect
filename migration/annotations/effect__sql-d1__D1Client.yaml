"@effect/sql-d1/D1Client#D1Client":
  replacement: "@effect/sql-d1/D1Client#D1Client"
  note: "Retained; the service value is now a Context.Service, and v4 adds batch for atomic D1 batches. The D1Client interface no longer extends SqlClient.SqlClient. Yielding the service still gives D1Client & SqlClient, but an effect that requires D1Client no longer type-checks against a SqlClient requirement annotation, and a SqlClient-only layer no longer satisfies D1Client. Annotate a layer chosen between drivers as Layer.Layer<SqlClient.SqlClient, E>."
"@effect/sql-d1/D1Client#D1ClientConfig":
  replacement: "@effect/sql-d1/D1Client#D1ClientConfig"
  note: "Retained; prepareCacheTTL now uses Duration.Input."
