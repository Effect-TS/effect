effect/RuntimeFlags#cooperativeYielding:
  replacement: "!References.PreventSchedulerYield"
  note: "Read the scheduler Reference and negate it; the aggregate flags value was removed."
effect/RuntimeFlags#CooperativeYielding:
  replacement: "References.PreventSchedulerYield"
  note: "Use the scheduler Reference with inverse boolean meaning."
effect/RuntimeFlags#disableCooperativeYielding:
  replacement: "Effect.provideService(References.PreventSchedulerYield, true)"
  note: "Prevent scheduler yielding through its Context.Reference."
effect/RuntimeFlags#disableInterruption:
  replacement: "Effect.uninterruptible"
  note: "Use an uninterruptible region instead of changing a runtime flag."
effect/RuntimeFlags#disableRuntimeMetrics:
  replacement: "Metric.disableRuntimeMetrics"
  note: "Disable fiber runtime metrics directly; use disableRuntimeMetricsLayer when providing a Layer."
effect/RuntimeFlags#enableCooperativeYielding:
  replacement: "Effect.provideService(References.PreventSchedulerYield, false)"
  note: "Allow scheduler yielding through its Context.Reference."
effect/RuntimeFlags#enableInterruption:
  replacement: "Effect.interruptible"
  note: "Use an interruptible region instead of changing a runtime flag."
effect/RuntimeFlags#enableRuntimeMetrics:
  replacement: "Metric.enableRuntimeMetrics"
  note: "Enable fiber runtime metrics directly; use enableRuntimeMetricsLayer when providing a Layer."
effect/RuntimeFlags#Interruption:
  replacement: "Effect.interruptible | Effect.uninterruptible"
  note: "The bit flag was removed; control interruptibility with Effect regions."
effect/RuntimeFlags#runtimeMetrics:
  replacement: "Metric.FiberRuntimeMetrics"
  note: "Read the Context.Reference and test for undefined instead of querying a bit flag."
effect/RuntimeFlags#RuntimeMetrics:
  replacement: "Metric.FiberRuntimeMetrics"
  note: "Runtime metrics are now configured through a Context.Reference service rather than a bit flag."
effect/RuntimeFlags:
  replacement: varies by API
  note: The runtime-flags bitset was removed; configure each semantic behavior directly. The runtime-flags bitset and patch differ were removed. The generic flag operation was removed; disable the corresponding behavior directly. The aggregate flags value was removed; configure scheduler yielding, interruptibility, and metrics independently. Operation supervision and its runtime flag were removed. The wind-down flag is runtime-internal in v4; use normal scoped finalizers and explicit interruptibility regions. The generic flag operation was removed; enable the corresponding behavior directly. There is no public current-interruptibility getter; structure the program with Effect.interruptible or Effect.uninterruptible. Interruptibility is controlled by Effect regions rather than queried from a flags value. There is no aggregate flags value to query; inspect or control the corresponding semantic facility. The runtime-flags bitset was removed; do not recreate it in v4. The runtime-flags bitset was removed; configure each semantic behavior independently. The empty runtime-flags value and its type were removed. Aggregate runtime-flags patches were removed; configure each semantic behavior directly. The runtime-flags bitset and its renderer were removed. Individual bit flags were removed; use the corresponding semantic API. The aggregate runtime-flags bitset was removed. The runtime-flags bitset was removed; there is no set conversion. The wind-down flag is no longer public.
