"@effect/sql-pg/PgClient":
  replacement: "effect/postgres/PgClient"
  note: "The native PostgreSQL client moved into Effect core. Provide platform SocketConnector and Crypto services for constructors and layers."
"@effect/sql-pg/PgClient#fromPool":
  replacement: none
  note: "Wrapping an existing node-pg Pool was removed with the native protocol client. Use PgClient.make or PgClient.layer with connection settings."
"@effect/sql-pg/PgClient#layerFromPool":
  replacement: "effect/postgres/PgClient#layer"
  note: "Wrapping an existing node-pg Pool was removed. Provide connection settings to PgClient.layer instead."
"@effect/sql-pg/PgClient#PgClient":
  replacement: "effect/postgres/PgClient#PgClient"
  note: "Moved to effect/postgres/PgClient; provide platform SocketConnector and Crypto layers. The service value is now a Context.Service. The listen method returns a scoped Effect acquiring a Queue.Dequeue<PgConnection.Notification, SqlError>; consume it with Queue operations or Stream.fromQueue and read each notification's payload. Connection failures after registration fail the queue with the original SqlError; scope closure interrupts consumers."
"@effect/sql-pg/PgClient#PgClientConfig":
  include: true
  replacement: "effect/postgres/PgClient#PgClientConfig / PgPoolConfig"
  note: "Use PgClientConfig for base settings and PgPoolConfig for make/layer; pool sizing, idle timeout, and connection TTL moved to PgPoolConfig. The types option takes a PgTypes.Registry rather than node-pg custom types. Timestamp and timestamptz results (including array elements) are Date values with millisecond precision; infinity, -infinity, and out-of-range values become invalid Dates. Numeric readers can use getTime() or register numeric codecs. Date parameters bind as timestamptz; use PgTypes.timestamp(value) to preserve UTC fields when writing a timestamp column instead of applying the session TimeZone."
"@effect/sql-pg/PgClient#PgClientFromPoolOptions":
  replacement: none
  note: "The node-pg Pool wrapper options were removed with fromPool. Use PgClient.PgPoolConfig with PgClient.make or PgClient.layer."
"@effect/sql-pg/PgClient#PgCustom":
  replacement: "effect/postgres/PgClient#PgCustom"
  note: "Import the PostgreSQL custom SQL fragment type from effect/postgres/PgClient."
"@effect/sql-pg/PgClient#TypeId":
  replacement: "effect/postgres/PgClient#TypeId"
  note: "Import the client marker from its new namespace; its identifier is now ~effect/postgres/PgClient."
"@effect/sql-pg/PgClient#make":
  replacement: "effect/postgres/PgClient#make"
  note: "Construct the native client with connection settings and provide platform SocketConnector and Crypto services. Native connection and codec options replace node-pg driver options."
"@effect/sql-pg/PgClient#layer":
  replacement: "effect/postgres/PgClient#layer"
  note: "Import from effect/postgres/PgClient and provide runtime SocketConnector and Crypto layers. The layer provides both PgClient and SqlClient."
"@effect/sql-pg/PgClient#layerConfig":
  replacement: "effect/postgres/PgClient#layerConfig"
  note: "Import from effect/postgres/PgClient and compose runtime SocketConnector and Crypto layers with the configuration-backed client layer."
"@effect/sql-pg/PgClient#makeCompiler":
  replacement: "effect/postgres/PgClient#makeCompiler"
  note: "Import the PostgreSQL statement compiler from effect/postgres/PgClient."
