"effect/ConfigError#And":
  replacement: "SchemaIssue.Composite"
  note: "The ConfigError boolean ADT was removed; combined schema failures are represented inside Config.ConfigError.cause as SchemaIssue.Composite."
"effect/ConfigError#ConfigError":
  replacement: "Config.ConfigError"
  note: "Config errors are now a class in effect/Config wrapping either ConfigProvider.SourceError or Schema.SchemaError."
"effect/ConfigError#ConfigError.Proto":
  replacement: "Config.ConfigError"
  note: "The public prototype interface was removed; use the Config.ConfigError class."
"effect/ConfigError#ConfigError.Reducer":
  replacement: "none"
  note: "The ConfigError-specific reducer API was removed; inspect ConfigError.cause and recurse over SchemaError.issue when structured handling is required."
"effect/ConfigError#ConfigErrorReducer":
  replacement: "none"
  note: "The ConfigError-specific reducer API was removed; inspect ConfigError.cause and recurse over SchemaError.issue when structured handling is required."
"effect/ConfigError#ConfigErrorTypeId":
  replacement: "error instanceof Config.ConfigError"
  note: "The marker is gone because ConfigError is a class in v4."
"effect/ConfigError#InvalidData":
  replacement: "new Config.ConfigError(new Schema.SchemaError(issue))"
  note: "Invalid configuration is now expressed as a SchemaIssue wrapped by SchemaError and Config.ConfigError."
"effect/ConfigError#isAnd":
  replacement: "error.cause.issue._tag === \"Composite\""
  note: "After narrowing cause with Schema.isSchemaError, inspect the SchemaIssue tag; the old And node no longer exists."
"effect/ConfigError#isConfigError":
  replacement: "error instanceof Config.ConfigError"
  note: "ConfigError is a class in v4."
"effect/ConfigError#isInvalidData":
  replacement: "Schema.isSchemaError(error.cause)"
  note: "Parsing and validation failures are SchemaError causes; inspect the contained SchemaIssue for finer classification."
"effect/ConfigError#isMissingData":
  replacement: "Schema.isSchemaError(error.cause)"
  note: "After narrowing to SchemaError, recursively inspect MissingKey, absent InvalidType/InvalidValue, Pointer, and aggregate issues; there is no public one-step guard."
"effect/ConfigError#isMissingDataOnly":
  replacement: "Config.withDefault / Config.option"
  note: "The public classifier was removed; these combinators retain the supported missing-only fallback behavior."
"effect/ConfigError#isOr":
  replacement: "error.cause.issue._tag === \"AnyOf\""
  note: "After narrowing cause with Schema.isSchemaError, inspect the SchemaIssue tag; the old Or node no longer exists."
"effect/ConfigError#isSourceUnavailable":
  replacement: "error.cause instanceof ConfigProvider.SourceError"
  note: "Provider source failures now use the ConfigProvider.SourceError class."
"effect/ConfigError#isUnsupported":
  replacement: "none"
  note: "The Unsupported variant was removed; report unsupported custom decoding through a SchemaError or source failures through ConfigProvider.SourceError."
"effect/ConfigError#MissingData":
  replacement: "new Config.ConfigError(new Schema.SchemaError(new SchemaIssue.MissingKey(...)))"
  note: "Missing configuration is represented by Schema issues, commonly MissingKey under one or more Pointer nodes."
"effect/ConfigError#Options":
  replacement: "none"
  note: "The shared constructor options type was removed; ConfigProvider.SourceError accepts message and optional cause, while Schema issues have issue-specific constructors."
"effect/ConfigError#Or":
  replacement: "SchemaIssue.AnyOf"
  note: "The ConfigError boolean ADT was removed; alternative schema failures are represented inside Config.ConfigError.cause as SchemaIssue.AnyOf."
"effect/ConfigError#prefixed":
  replacement: "SchemaIssue.Pointer"
  note: "Represent path context by wrapping the underlying SchemaIssue in a Pointer before constructing SchemaError."
"effect/ConfigError#reduceWithContext":
  replacement: "none"
  note: "The specialized fold was removed; branch on ConfigError.cause, then recurse over the public SchemaIssue union if a fold is needed."
"effect/ConfigError#SourceUnavailable":
  replacement: "new ConfigProvider.SourceError({ message, cause })"
  note: "Source failures moved to effect/ConfigProvider and are wrapped by Config.ConfigError when a Config is parsed."
"effect/ConfigError#Unsupported":
  replacement: "none"
  note: "The variant was removed; use a SchemaError for unsupported input or ConfigProvider.SourceError for source capability failures."
