"@effect/cli/CommandDirective":
  replacement: varies by API
  note: The intermediate parse-result model was removed; the runner invokes the selected handler directly. Intermediate built-in directives were removed. Map parameters or transform in the handler; there is no intermediate directive to map. The user-defined intermediate directive was removed. Parsed input is delivered directly to the selected command handler.
