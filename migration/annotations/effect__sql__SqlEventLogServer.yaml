"@effect/sql/SqlEventLogServer#layerStorage":
  include: true
  replacement: "effect/eventlog/SqlEventLogServerEncrypted#layerStorage"
  note: "Moved to the encrypted server module; remove insertBatchSize. entryTablePrefix and remoteIdTable remain, as does the EventLogEncryption requirement. Storage uses encrypted batch tables and entry-id lookup tables, not the old per-entry ciphertext schema; existing encrypted tables are not automatically converted."
"@effect/sql/SqlEventLogServer#makeStorage":
  include: true
  replacement: "effect/eventlog/SqlEventLogServerEncrypted#makeStorage"
  note: "Moved to the encrypted server module; remove insertBatchSize. SQL, encryption, and scope requirements remain. Storage uses encrypted batch tables and entry-id lookup tables, not the old per-entry ciphertext schema; existing encrypted tables are not automatically converted."
"@effect/sql/SqlEventLogServer#layerStorageSubtle":
  include: true
  replacement: "effect/eventlog/SqlEventLogServerEncrypted#layerStorageSubtle"
  note: "Moved to the encrypted server module; remove insertBatchSize. The layer still supplies Web Crypto encryption. Storage now uses encrypted batch tables and entry-id lookup tables; existing per-entry ciphertext tables are not automatically converted."
