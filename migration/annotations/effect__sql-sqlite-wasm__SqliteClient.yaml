"@effect/sql-sqlite-wasm/SqliteClient#currentTransferables":
  replacement: "@effect/sql-sqlite-wasm/SqliteClient#Transferables"
  note: "Renamed and changed from FiberRef to Context.Reference; prefer withTransferables or provide Transferables as a service."
"@effect/sql-sqlite-wasm/SqliteClient#SqliteClient":
  replacement: "@effect/sql-sqlite-wasm/SqliteClient#SqliteClient"
  note: "Retained with the same export/import surface; the service value is now a Context.Service. The SqliteClient interface no longer extends SqlClient.SqlClient. Yielding the service still gives SqliteClient & SqlClient, but an effect that requires SqliteClient no longer type-checks against a SqlClient requirement annotation, and a SqlClient-only layer no longer satisfies SqliteClient. Annotate a layer chosen between drivers as Layer.Layer<SqlClient.SqlClient, E>."
