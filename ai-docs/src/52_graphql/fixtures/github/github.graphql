# A trimmed copy of GitHub's public GraphQL schema, with only the types the
# ai-docs examples select. Generate against the full schema in a real project.

"""
An ISO-8601 encoded UTC date string.
"""
scalar DateTime

"""
An RFC 3986, RFC 3987, and RFC 6570 (level 4) compliant URI string.
"""
scalar URI

"""
An object with an ID.
"""
interface Node {
  """
  ID of the object.
  """
  id: ID!
}

"""
The query root of GitHub's GraphQL interface.
"""
type Query {
  """
  The currently authenticated user.
  """
  viewer: User!

  """
  Lookup a given repository by the owner and repository name.
  """
  repository(owner: String!, name: String!): Repository

  """
  Lookup a node by its ID.
  """
  node(id: ID!): Node

  """
  Lookup nodes by a list of IDs.
  """
  nodes(ids: [ID!]!): [Node]!

  """
  The client's rate limit information.
  """
  rateLimit(dryRun: Boolean = false): RateLimit
}

"""
The root query for implementing GraphQL mutations.
"""
type Mutation {
  """
  Adds a comment to an Issue or Pull Request.
  """
  addComment(input: AddCommentInput!): AddCommentPayload
}

"""
Represents the client's rate limit.
"""
type RateLimit {
  """
  The point cost for the current query counting against the rate limit.
  """
  cost: Int!

  """
  The number of points remaining in the current rate limit window.
  """
  remaining: Int!

  """
  The time at which the current rate limit window resets in UTC epoch seconds.
  """
  resetAt: DateTime!
}

"""
A user is an individual's account on GitHub that owns repositories and can make new content.
"""
type User implements Node {
  id: ID!

  """
  The username used to login.
  """
  login: String!

  """
  The user's public profile name.
  """
  name: String
}

"""
A repository contains the content for a project.
"""
type Repository implements Node {
  id: ID!

  """
  The repository's name with owner.
  """
  nameWithOwner: String!

  """
  A list of issues that have been opened in the repository.
  """
  issues(first: Int, after: String, states: [IssueState!]): IssueConnection!

  """
  A list of pull requests that have been opened in the repository.
  """
  pullRequests(first: Int, after: String, states: [PullRequestState!]): PullRequestConnection!
}

"""
An Issue is a place to discuss ideas, enhancements, tasks, and bugs for a project.
"""
type Issue implements Node {
  id: ID!

  """
  Identifies the issue number.
  """
  number: Int!

  """
  Identifies the issue title.
  """
  title: String!

  """
  Identifies the state of the issue.
  """
  state: IssueState!

  """
  The HTTP URL for this issue
  """
  url: URI!

  """
  Identifies the date and time when the object was created.
  """
  createdAt: DateTime!
}

"""
A repository pull request.
"""
type PullRequest implements Node {
  id: ID!

  """
  Identifies the pull request number.
  """
  number: Int!

  """
  Identifies the pull request title.
  """
  title: String!

  """
  Identifies the state of the pull request.
  """
  state: PullRequestState!

  """
  Whether or not the pull request was merged.
  """
  merged: Boolean!
}

"""
The possible states of an issue.
"""
enum IssueState {
  """
  An issue that has been closed
  """
  CLOSED

  """
  An issue that is still open
  """
  OPEN
}

"""
The possible states of a pull request.
"""
enum PullRequestState {
  """
  A pull request that has been closed without being merged.
  """
  CLOSED

  """
  A pull request that has been closed by being merged.
  """
  MERGED

  """
  A pull request that is still open.
  """
  OPEN
}

"""
Information about pagination in a connection.
"""
type PageInfo {
  """
  When paginating forwards, the cursor to continue.
  """
  endCursor: String

  """
  When paginating forwards, are there more items?
  """
  hasNextPage: Boolean!
}

"""
The connection type for Issue.
"""
type IssueConnection {
  """
  A list of edges.
  """
  edges: [IssueEdge]

  """
  A list of nodes.
  """
  nodes: [Issue]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  Identifies the total count of items in the connection.
  """
  totalCount: Int!
}

"""
An edge in a connection.
"""
type IssueEdge {
  """
  A cursor for use in pagination.
  """
  cursor: String!

  """
  The item at the end of the edge.
  """
  node: Issue
}

"""
The connection type for PullRequest.
"""
type PullRequestConnection {
  """
  A list of nodes.
  """
  nodes: [PullRequest]

  """
  Information to aid in pagination.
  """
  pageInfo: PageInfo!

  """
  Identifies the total count of items in the connection.
  """
  totalCount: Int!
}

"""
Autogenerated input type of AddComment
"""
input AddCommentInput {
  """
  The contents of the comment.
  """
  body: String!

  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String

  """
  The Node ID of the subject to modify.
  """
  subjectId: ID!
}

"""
Autogenerated return type of AddComment.
"""
type AddCommentPayload {
  """
  A unique identifier for the client performing the mutation.
  """
  clientMutationId: String
}
